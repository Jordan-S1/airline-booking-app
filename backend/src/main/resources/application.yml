server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: airline-booking-system

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Flyway — versioned database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

# JWT configuration
# Generate a production secret with: openssl rand -base64 32
# Inject via environment variable JWT_SECRET — never hardcode
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

# Rolling flight schedule
# Each distinct flight number is treated as a daily service and materialised
# across the horizon, so the app always has bookable inventory. Past flights
# are pruned only when they were never booked.
flights:
  schedule:
    enabled: ${FLIGHT_SCHEDULE_ENABLED:true}
    horizon-days: ${FLIGHT_SCHEDULE_HORIZON_DAYS:14}
    retention-days: ${FLIGHT_SCHEDULE_RETENTION_DAYS:3}
    cron: ${FLIGHT_SCHEDULE_CRON:0 15 3 * * *}

# OpenSky Network — live ADS-B traffic (no API key required)
# The anonymous tier allows 400 credits/day and a bounding-box request costs
# 1-4 credits by area, so keep the box small and the cache TTL generous.
# Defaults below cover Ireland & the UK, matching the busiest seeded routes.
opensky:
  base-url: ${OPENSKY_BASE_URL:https://opensky-network.org/api}
  region-name: ${OPENSKY_REGION_NAME:Ireland & UK}
  cache-ttl-seconds: ${OPENSKY_CACHE_TTL_SECONDS:600}
  max-results: ${OPENSKY_MAX_RESULTS:20}
  bbox:
    lamin: ${OPENSKY_BBOX_LAMIN:49.0}
    lomin: ${OPENSKY_BBOX_LOMIN:-11.0}
    lamax: ${OPENSKY_BBOX_LAMAX:56.0}
    lomax: ${OPENSKY_BBOX_LOMAX:2.0}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true

# Logging
logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR