# ============================================================
# Docker Compose - Airline Booking System
# ============================================================
# Development usage:
#   docker-compose up -d          → start DB only
#   docker-compose --profile app up -d → start DB + Spring Boot app
#
# Requires a .env file in the same directory.
# Copy .env.example to .env and fill in your values.
# ============================================================

services:
  # ------ PostgreSQL Database ----------------------
  db:
    container_name: airline-booking-db
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: airline_booking
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - airline-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d airline_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------ Mailpit — local SMTP catcher -------------
  # Accepts any mail and shows it at http://localhost:8025. Nothing leaves the
  # machine, so password reset can be demonstrated end to end without a domain,
  # a provider account, or the risk of mailing a real stranger.
  # (Mailpit, not MailHog: same idea, still maintained.)
  mail:
    container_name: airline-mailpit
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox
    networks:
      - airline-network
    restart: unless-stopped

  # ------ Spring Boot Application ---------------
  # Run with: docker-compose --profile app up
  # Or run the app locally and only use the DB service above.
  app:
    profiles:
      - app
    container_name: airline-booking-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/airline_booking
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # Required on first start against an empty database: DataSeeder reads
      # these via System.getenv and refuses to boot without them.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SERVER_PORT: ${SERVER_PORT:-8080}
      # Mock payment gateway. Off by default; set the rate to 1.0 to exercise
      # the failure path deliberately, e.g.
      #   PAYMENT_SIMULATED_FAILURE_RATE=1.0 docker compose --profile app up -d
      PAYMENT_SIMULATED_FAILURE_RATE: ${PAYMENT_SIMULATED_FAILURE_RATE:-0.0}
      PAYMENT_SIMULATED_LATENCY_MS: ${PAYMENT_SIMULATED_LATENCY_MS:-600}
      # AI travel assistant. Optional: an empty value disables the feature
      # rather than failing, so the default here is a working configuration.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-8192}
      # Password reset delivery. Points at the mailpit service above, so the
      # compose stack demonstrates real SMTP out of the box. Clear
      # SPRING_MAIL_HOST to fall back to logging the link instead.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mail}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@skyair.example}
      # The link must be absolute to be clickable from an inbox, and points at
      # the frontend because /reset-password is a frontend route.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - airline-network
    restart: unless-stopped

networks:
  airline-network:
    driver: bridge
volumes:
  db:
