name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # No environment setup: 184 of the tests mock their collaborators, and
      # ApplicationTests and AirportRepositoryTest start their own Postgres via
      # Testcontainers, which works because ubuntu-latest ships a running
      # Docker daemon.
      - name: Run tests
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress test

      # Surefire XML is the only way to see which case failed once the runner
      # is gone, so keep it even (especially) when the job fails.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Vite 7 requires ^20.19 || >=22.12 and ESLint 10 requires
      # ^20.19 || ^22.13 || >=24. Pinning 22 satisfies both without
      # depending on which patch release 20 happens to resolve to.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      # `npm run build` is `tsc -b && vite build`, so this type-checks too.
      - name: Build
        working-directory: frontend
        run: npm run build

  image:
    name: Publish image
    needs: [backend, frontend]
    # Only for merged work: a pull request from a fork cannot be trusted with
    # package write access, and there is nothing to publish from a branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in image names and this repository's owner is
      # "Jordan-S1", so ${{ github.repository }} cannot be used verbatim.
      - name: Derive lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA as well as latest, so a deployment can name
      # exactly what it is running rather than whatever latest points at now.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
